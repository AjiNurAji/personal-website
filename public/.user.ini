; =============================================
; PHP Security Hardening for Shared Hosting
; Place this file in public/ as .user.ini
; Many shared hosts (cPanel) apply user.ini per-directory
; =============================================

; Hide PHP version from headers
expose_php = Off

; Disable URL fopen (prevents RFI attacks)
allow_url_fopen = Off
allow_url_include = Off

; Disable dangerous functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Set upload limits
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
max_input_time = 60
memory_limit = 256M

; Session security
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1

; Error handling - log errors, never display
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
